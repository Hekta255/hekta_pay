name: Deploy Hekta Pay to pay.sebuleni.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hekta-pay-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Hekta Pay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, json, pdo, pdo_mysql

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          find public src database/migrations -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate required deployment files
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.php
          test -f public/.htaccess
          test -f src/autoload.php
          test -f src/Database/Connection.php
          test -f src/Payment/PaymentOrchestrator.php
          test -f src/Services/WebhookDispatcher.php

      - name: Check tracked files for environment secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|\.env\.|.*\.pem$|.*\.key$)' ; then
            echo 'Tracked environment or private-key files detected.'
            exit 1
          fi

  deploy:
    name: Upload to pay.sebuleni.com
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: production
      url: https://pay.sebuleni.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload public document root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./public/
          server-dir: ./pay.sebuleni.com/
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*
            **/*.log

      - name: Upload application source outside document root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./src/
          server-dir: ./pay.sebuleni.com/src/
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*
            **/*.log

      - name: Verify public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --max-time 30 https://pay.sebuleni.com/health)"
          echo "$response"
          echo "$response" | grep -q '"success":true'
